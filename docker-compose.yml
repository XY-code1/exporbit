services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exporbit
      POSTGRES_USER: exporbit
      POSTGRES_PASSWORD: exporbit_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exporbit -d exporbit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - exporbit_postgres:/var/lib/postgresql/data
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro

volumes:
  exporbit_postgres:

